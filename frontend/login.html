<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <title>HAYA</title>
</head>
<body class="loginBody">

    <div class="loginPageDiv">
        <div class="loginLogoContainer">
            <img src="IMG/logo.png" class="loginPageLogo">
        </div>


        <div class ="loginInfoContainer">

            <input type="text" class="loginInputUsername" placeholder="Username">
            <input type="password" class="loginInputPassword" placeholder="Password">
            <div class = "showPasswordContainer">
                <input type="checkbox" class="loginShowPasswordCheckbox" id="loginShowPasswordCheckbox">
                <p>Show password</p>
            </div>


            <a href="#">
                <button class="loginSubmitButton">Log In</button>
            </a>


            <a href="index.html">
                <button class="backButton">Back</button>
            </a>


            <script>
                const loginShowPasswordCheckbox = document.getElementById('loginShowPasswordCheckbox');
                const loginInputPassword = document.querySelector('.loginInputPassword');
                const loginInputUsername = document.querySelector('.loginInputUsername');
                const loginSubmitButton = document.querySelector('.loginSubmitButton');

                // Dummy username and password for MVP
                const validUsername = '';
                const validPassword = '';

                // Function to show or hide the password
                loginShowPasswordCheckbox.addEventListener('change', function() {
                    if (this.checked) {
                        loginInputPassword.type = 'text';
                    } else {
                        loginInputPassword.type = 'password';
                    }
                });

                // Function to check login and redirect
                function login() {
                    const username = loginInputUsername.value;
                    const password = loginInputPassword.value;

                    // Check if the entered credentials match the dummy data
                    if (username === validUsername && password === validPassword) {
                        // Redirect to another page upon successful login
                        window.location.href = 'dashboard.html'; // Replace with your desired destination page
                    } else {
                        // Display an error message
                        alert('Invalid username or password');
                    }
                }

                // Event listener for the login button
                loginSubmitButton.addEventListener('click', function(event) {
                    event.preventDefault(); // Prevent the default form submit action
                    login(); // Trigger login function
                });

                // Event listener for pressing the Enter key (Enter key code is 13)
                window.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        login(); // Trigger login function when Enter is pressed
                    }
                });
            </script>


            

        </div>
        
    </div>

</body>
</html>
